name: Build

# Builds the Steam Link player, the Linux script and the installer apps on every push and pull
# request. To publish a release: Actions > Build > Run workflow, and enter a version like v1.0.0
# (or push a tag like v1.0.0).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as a release with this version, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install zig (cross-compiler for the Steam Link)
        run: pip install ziglang==0.17.0

      - name: Build
        run: ./build.sh legacy

      - name: Add license files
        run: cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: steamlink-speaker
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "Version must look like v1.0.0, got '$VERSION'"; exit 1 ;;
          esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            # Creates the tag on the commit that was just built if it doesn't exist yet.
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" \
              --title "Steam Link Speaker $VERSION" \
              --notes-file .github/release-notes.md
          fi
