name: Build

# Builds the Steam Link player, the Linux script and the installer apps on every push and pull
# request. Pushing a tag like v1.0.0 also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install zig (cross-compiler for the Steam Link)
        run: pip install ziglang==0.17.0

      - name: Build
        run: ./build.sh legacy

      - name: Add license files
        run: cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: steamlink-speaker
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Steam Link Speaker $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          fi
